---
name: "CodeQL"
on:
  # Do not run on pull_request while GitHub **CodeQL default setup** is enabled on the repo:
  # SARIF upload from this workflow is rejected (*advanced configurations cannot be processed*).
  # Default setup already runs javascript-typescript analysis on PRs. Re-enable pull_request
  # after switching the repo to advanced setup (Settings → Code security → Disable CodeQL default).
  schedule:
    - cron: "26 17 * * 0"
  workflow_dispatch:
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # Custom workflow + codeql-config.yml require advanced setup; default CodeQL on the repo must yield to this job.
          disable-default-setup: true
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.7
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
