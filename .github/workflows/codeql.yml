---
name: "CodeQL"
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  schedule:
    - cron: "26 17 * * 0"
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # Custom workflow + codeql-config.yml require advanced setup; default CodeQL on the repo must yield to this job.
          disable-default-setup: true
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.7
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
