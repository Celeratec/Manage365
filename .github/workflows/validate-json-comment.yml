---
name: Validate JSON (Comment)
on:
  workflow_run:
    workflows: ["Validate JSON (Check)"]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    name: Post PR comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download validation results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: json-validation-results-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment on PR
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- validate-json -->';
            const resultsFile = 'json-validation-results.json';
            const metadataFile = 'validation-metadata.json';
            
            let prNumber = context.payload.workflow_run.pull_requests[0]?.number;
            
            if (!prNumber && fs.existsSync(metadataFile)) {
              try {
                const metadata = JSON.parse(fs.readFileSync(metadataFile, 'utf8'));
                prNumber = metadata.pr_number;
              } catch (error) {
                core.warning(`Failed to read metadata: ${error.message}`);
              }
            }
            
            if (!prNumber) {
              const headSha = context.payload.workflow_run.head_sha;
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: headSha,
              });
              if (prs.length > 0) {
                prNumber = prs[0].number;
                core.info(`Resolved PR #${prNumber} from commit ${headSha}`);
              }
            }
            
            if (!prNumber || prNumber < 1) {
              core.warning('Could not resolve PR number — skipping comment.');
              return;
            }
            
            const headSha = context.payload.workflow_run.head_sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: headSha,
            });
            const matchingPr = prs.find(pr => pr.number === prNumber);
            if (!matchingPr) {
              core.error(`PR #${prNumber} not associated with commit ${headSha} — refusing to comment.`);
              return;
            }
            
            if (!fs.existsSync(resultsFile)) {
              core.warning('No validation results found — skipping PR comment.');
              return;
            }
            
            let rawContent;
            try {
              rawContent = fs.readFileSync(resultsFile, 'utf8');
            } catch (error) {
              core.warning(`Failed to read results file: ${error.message}`);
              return;
            }
            
            let failures;
            try {
              failures = JSON.parse(rawContent);
            } catch (error) {
              core.warning(`Results file is not valid JSON: ${error.message}`);
              return;
            }
            
            if (!Array.isArray(failures)) {
              core.warning('Results file is not an array — skipping comment.');
              return;
            }
            
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => (c.user.type === 'Bot' || c.user.login === 'github-actions[bot]') && c.body.includes(marker)
            );
            
            function escapeMarkdown(text) {
              return text
                .replace(/[\\]/g, '\\\\')
                .replace(/[`*_{}[\]()#+\-!|@]/g, '\\$&')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            }
            
            let body;
            if (failures.length > 0) {
              const list = failures
                .slice(0, 50)
                .map(({ file, message }) => {
                  const safeFile = escapeMarkdown(String(file || 'unknown').substring(0, 200));
                  const safeMessage = escapeMarkdown(String(message || 'Parse error').substring(0, 500));
                  return `- \`${safeFile}\`\n  > ${safeMessage}`;
                })
                .join('\n');
              const suffix = failures.length > 50 ? `\n\n_(showing first 50 of ${failures.length} failures)_` : '';
              body =
                `${marker}\n### ⚠️ Invalid JSON detected\n\n` +
                `${failures.length} JSON file(s) in this PR could not be parsed. ` +
                `These files are loaded directly by Manage365, so a syntax error here breaks the app at runtime.\n\n` +
                `${list}${suffix}\n\n` +
                `Please fix the syntax and push again — this comment will update automatically.`;
            } else if (existing) {
              body = `${marker}\n### ✅ JSON is valid\n\nAll JSON files in \`frontend/public\` and \`frontend/src/data\` parse correctly. Thanks for fixing it!`;
            } else {
              return;
            }
            
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
