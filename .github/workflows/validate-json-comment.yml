---
name: Validate JSON (Comment)
on:
  workflow_run:
    workflows: ["Validate JSON (Check)"]
    types: [completed]
permissions:
  pull-requests: write
jobs:
  comment:
    name: Post PR comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download validation results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: json-validation-results-${{ github.event.workflow_run.pull_requests[0].number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Comment on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- validate-json -->';
            const resultsFile = 'json-validation-results.json';
            
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (!prNumber || prNumber < 1) {
              core.warning('Invalid PR number from workflow_run event — skipping comment.');
              return;
            }
            
            if (!fs.existsSync(resultsFile)) {
              core.warning('No validation results found — skipping PR comment.');
              return;
            }
            
            let rawContent;
            try {
              rawContent = fs.readFileSync(resultsFile, 'utf8');
            } catch (error) {
              core.warning(`Failed to read results file: ${error.message}`);
              return;
            }
            
            let failures;
            try {
              failures = JSON.parse(rawContent);
            } catch (error) {
              core.warning(`Results file is not valid JSON: ${error.message}`);
              return;
            }
            
            if (!Array.isArray(failures)) {
              core.warning('Results file is not an array — skipping comment.');
              return;
            }
            
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );
            
            function escapeMarkdown(text) {
              return text.replace(/[`]/g, '\\`').replace(/[<>]/g, (m) => m === '<' ? '&lt;' : '&gt;');
            }
            
            let body;
            if (failures.length > 0) {
              const list = failures
                .slice(0, 50)
                .map(({ file, message }) => {
                  const safeFile = escapeMarkdown(String(file || 'unknown'));
                  const safeMessage = escapeMarkdown(String(message || 'Parse error').substring(0, 500));
                  return `- \`${safeFile}\`\n  > ${safeMessage}`;
                })
                .join('\n');
              const suffix = failures.length > 50 ? `\n\n_(showing first 50 of ${failures.length} failures)_` : '';
              body =
                `${marker}\n### ⚠️ Invalid JSON detected\n\n` +
                `${failures.length} JSON file(s) in this PR could not be parsed. ` +
                `These files are loaded directly by Manage365, so a syntax error here breaks the app at runtime.\n\n` +
                `${list}${suffix}\n\n` +
                `Please fix the syntax and push again — this comment will update automatically.`;
            } else if (existing) {
              body = `${marker}\n### ✅ JSON is valid\n\nAll JSON files in \`frontend/public\` and \`frontend/src/data\` parse correctly. Thanks for fixing it!`;
            } else {
              return;
            }
            
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
