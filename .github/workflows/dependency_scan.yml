---
name: Dependency Vulnerability Scan
on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  yarn-audit:
    name: yarn audit
    runs-on: ubuntu-latest
    # Checkout and audit only; nothing is written back to the repo.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Node version comes from frontend/package.json `engines.node` so CI can
      # never drift from what the app declares it supports.
      - name: Use Node.js from package.json engines
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Audit for high/critical vulnerabilities
        # Yarn 1 ignores --level for the exit code. The code is a bitfield:
        # 1 info, 2 low, 4 moderate, 8 high, 16 critical. Fail only on high or critical.
        run: |
          set +e
          yarn audit --level high
          code=$?
          set -e
          if [ $((code & 24)) -ne 0 ]; then
            exit "$code"
          fi
