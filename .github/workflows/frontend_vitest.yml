---
name: Frontend Vitest
on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_vitest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # Split from the storybook project deliberately: this one needs no browser, so it is the
  # fast signal, and a flaky browser run can never mask a failing unit test.
  unit:
    name: vitest (unit)
    runs-on: ubuntu-latest
    # Checkout and test only; nothing is written back to the repo.
    permissions:
      contents: read
    strategy:
      # One red shard must not cancel the others: each shard covers different test
      # files, so the surviving shards still deliver signal on their slice.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Pinned to the patched 22.x release (CVE-2026-111497). dependency_scan
      # reads engines from package.json; this job pins explicitly for reproducibility.
      - name: Use Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # --testTimeout matches the existing test:coverage script. Several of these tests
      # drive userEvent through MUI autocompletes and comfortably exceed vitest's 5s
      # default on a loaded machine - at 5s they fail intermittently, and a different
      # handful each run. They pass consistently at 30s.
      # --shard splits by test file, so the denominator must match the matrix above.
      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: yarn test:unit --testTimeout=30000 --shard=${{ matrix.shard }}/4

  storybook:
    name: vitest (storybook)
    runs-on: ubuntu-latest
    # Checkout and test only; nothing is written back to the repo.
    permissions:
      contents: read
    strategy:
      # See the note on the unit matrix: shards are independent slices, keep them all running.
      fail-fast: false
      matrix:
        # More shards than unit: every story renders in real chromium, which dominates
        # the workflow's wall-clock time.
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Same patched pin as the unit job (CVE-2026-111497).
      - name: Use Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # Cache the ~150MB chromium download so each shard doesn't pull it separately.
      # Keyed on yarn.lock: a playwright bump changes the lockfile, which rotates the key.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
      # The storybook project renders in a real browser (@vitest/browser-playwright,
      # headless chromium per vitest.config.mjs), which the runner image does not provide.
      # Runs on cache hits too: it skips the download but still installs the system deps.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # --shard splits by story file, so the denominator must match the matrix above.
      - name: Run storybook tests (shard ${{ matrix.shard }}/6)
        run: yarn test:storybook --shard=${{ matrix.shard }}/6

  # Single stable check name for branch protection: matrixed jobs report as
  # "vitest (unit) (1)" etc., which would otherwise have to be listed one by one
  # (and re-listed whenever the shard counts change).
  summary:
    if: github.repository_owner == 'CyberDrain' && always()
    name: vitest (summary)
    needs: [unit, storybook]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.storybook.result }}" != "success" ]; then
            echo "unit: ${{ needs.unit.result }}, storybook: ${{ needs.storybook.result }}"
            exit 1
          fi
