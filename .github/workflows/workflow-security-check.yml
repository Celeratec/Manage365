---
name: Workflow Security Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/validate-workflow-security.sh'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/scripts/validate-workflow-security.sh'

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          echo "${PWD}" >> $GITHUB_PATH

      - name: Run actionlint
        continue-on-error: true
        run: actionlint -color || echo "::warning::actionlint found issues but continuing"

      - name: Run custom security checks
        run: .github/scripts/validate-workflow-security.sh
