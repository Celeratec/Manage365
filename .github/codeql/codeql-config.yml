name: "CIPP CodeQL config"

# The backend is PowerShell (covered by PSScriptAnalyzer + Pester); only the frontend is
# JavaScript, so scope the JS/TS analysis to it.
paths:
  - frontend

paths-ignore:
  # Generated by `msw init` and pinned to the installed msw version; the file itself says
  # not to modify it, so its findings cannot be acted on here.
  - frontend/public/mockServiceWorker.js
  # Storybook stories and vitest fixtures: random test data and mocked browser APIs are
  # not production code paths.
  - frontend/tests
